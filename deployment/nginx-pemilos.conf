# ==============================================================================
# PEMILOS ENTERPRISE NGINX CONFIGURATION (OPTIMIZED FOR 4GB RAM VPS)
# ==============================================================================
# Taruh file ini di: /etc/nginx/sites-available/pemilos
# Aktifkan dengan: sudo ln -sf /etc/nginx/sites-available/pemilos /etc/nginx/sites-enabled/
# Uji & Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name pemilos.smkn9semarang.sch.id 202.10.45.34 localhost; # Sesuaikan domain Anda

    root /var/www/pemilos/public;
    index index.php index.html index.htm;

    charset utf-8;
    client_max_body_size 12M;

    # --------------------------------------------------------------------------
    # 1. SECURITY HEADERS (OWASP RECOMMENDED)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 2. WEBSOCKET REVERSE PROXY (SOCKET.IO KE PORT 3001 DI LOCALHOST)
    # --------------------------------------------------------------------------
    # Mengalirkan koneksi realtime lewat port 80/443 tanpa membuka port 3001 ke internet
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 3. FASTCGI BUFFER TUNING (MENCEGAH 502/504 SAAT LONJAKAN REQUEST)
    # --------------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # Sesuaikan versi PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI buffer tuning untuk PHP-FPM
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 4. CACHE AGGRESIF UNTUK STATIC ASSETS (MENGHEMAT BANDWIDTH LAB & RAM)
    # --------------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 5. BLOKIR AKSES WEB KE BERKAS SENSITIF & KREDENSIAL
    # --------------------------------------------------------------------------
    location ~* \.(env|git|sql|xlsx|xls|csv|bak|log|sh)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 6. ROUTE DEFAULT LARAVEL
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Halaman Error
    error_page 404 /index.php;
}
