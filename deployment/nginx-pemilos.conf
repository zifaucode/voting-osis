# ==============================================================================
# PEMILOS ENTERPRISE NGINX CONFIGURATION (OPTIMIZED FOR 4GB RAM VPS)
# ==============================================================================
# Taruh file ini di: /etc/nginx/sites-available/pemilos
# Aktifkan dengan: sudo ln -sf /etc/nginx/sites-available/pemilos /etc/nginx/sites-enabled/
# Uji & Reload: sudo nginx -t && sudo systemctl reload nginx

# ------------------------------------------------------------------------------
# HTTP (PORT 80) -> Redirect ke HTTPS (kecuali ACME Challenge)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pormulir.my.id www.pormulir.my.id pemilos.smkn9semarang.sch.id 202.10.45.34 localhost;

    # ACME Challenge untuk pembaruan otomatis Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/pemilos/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect seluruh trafik HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (PORT 443) -> Full SSL + HTTP/2
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pormulir.my.id www.pormulir.my.id pemilos.smkn9semarang.sch.id 202.10.45.34 localhost;

    # Sertifikat SSL Resmi Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/pormulir.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pormulir.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    root /var/www/pemilos/public;
    index index.php index.html index.htm;

    charset utf-8;
    client_max_body_size 12M;

    # ACME Challenge
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/pemilos/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 1. SECURITY HEADERS (OWASP RECOMMENDED)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 2. WEBSOCKET REVERSE PROXY (SOCKET.IO KE PORT 3001)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 3. FASTCGI BUFFER TUNING UNTUK PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;
    }

    # 4. CACHE AGGRESIF UNTUK STATIC ASSETS
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # 5. BLOKIR AKSES WEB KE BERKAS SENSITIF & KREDENSIAL
    location ~* \.(env|git|sql|xlsx|xls|csv|bak|log|sh)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 6. ROUTE DEFAULT LARAVEL
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
}
