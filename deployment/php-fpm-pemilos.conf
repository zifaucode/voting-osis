# ==============================================================================
# PHP-FPM 8.2 POOL CONFIGURATION FOR 4GB RAM VPS (PEMILOS HIGH-CONCURRENCY)
# ==============================================================================
# Letakkan di: /etc/php/8.2/fpm/pool.d/www.conf (atau /etc/php/8.4/fpm/pool.d/www.conf)
# Terapkan: sudo systemctl restart php8.2-fpm

[www]
user = www-data
group = www-data
listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

# ------------------------------------------------------------------------------
# 1. PROCESS MANAGER: STATIC POOL (KUNCI ELIMINASI FORK LATENCY SAAT HARI-H)
# ------------------------------------------------------------------------------
# Pada mode static, 35 worker langsung di-fork dan dipanaskan di RAM saat boot.
# Menghilangkan delay 20-50ms CPU fork setiap kali puluhan siswa membuka web serempak!
pm = static
pm.max_children = 35

# Restart worker setiap 1000 request untuk mencegah kebocoran memori PHP
pm.max_requests = 1000

# Antrean koneksi OS jika 35 worker sedang sibuk sepersekian detik
listen.backlog = 2048

# ------------------------------------------------------------------------------
# 2. TIMEOUTS & SAFETY LIMITS
# ------------------------------------------------------------------------------
request_terminate_timeout = 30s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.2-fpm-slow.log

# ------------------------------------------------------------------------------
# 3. PHP VALUE OVERRIDES
# ------------------------------------------------------------------------------
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 30
php_admin_value[post_max_size] = 12M
php_admin_value[upload_max_filesize] = 10M

# ==============================================================================
# OPCACHE TUNING (/etc/php/8.2/fpm/conf.d/10-opcache.ini)
# ==============================================================================
